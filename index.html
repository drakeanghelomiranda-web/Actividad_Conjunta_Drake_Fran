<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Viatge amb Pressupost</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Planificador de Viatge</h1>
            <p class="subtitle">Calculador de pressupost i desglossament diari per a 1 persona</p>
        </header>

        <main>
            <!-- 1. Formulario de entrada -->
            <section class="card form-section">
                <h2>Dades del Viatge</h2>
                <form id="form-viatge" novalidate>
                    <div class="form-group full-width">
                        <label for="nomViatge">Nom del viatge:</label>
                        <input type="text" id="nomViatge" placeholder="Ex: Escapada a Girona" value="Escapada">
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="dataSortida">Data de sortida:</label>
                            <input type="date" id="dataSortida" value="2026-10-23">
                        </div>

                        <div class="form-group">
                            <label for="dataTornada">Data de tornada:</label>
                            <input type="date" id="dataTornada" value="2026-10-26">
                        </div>

                        <div class="form-group">
                            <label for="pressupost">Pressupost (€):</label>
                            <input type="number" id="pressupost" step="0.01" min="0.01" value="500">
                        </div>

                        <div class="form-group">
                            <label for="transport">Transport anada/tornada (€):</label>
                            <input type="number" id="transport" step="0.01" min="0" value="120">
                        </div>

                        <div class="form-group">
                            <label for="preuNit">Preu per nit (€):</label>
                            <input type="number" id="preuNit" step="0.01" min="0" value="65">
                        </div>

                        <div class="form-group">
                            <label for="despesaLaborable">Despesa laborable (€/dia):</label>
                            <input type="number" id="despesaLaborable" step="0.01" min="0" value="30">
                        </div>

                        <div class="form-group">
                            <label for="despesaCapSetmana">Despesa cap de setmana (€/dia):</label>
                            <input type="number" id="despesaCapSetmana" step="0.01" min="0" value="45">
                        </div>
                    </div>

                    <!-- Botones de acción requeridos -->
                    <!-- <div class="button-group">
                        <button type="button" id="btn-calcular" class="btn btn-primary">Calcular</button>
                        <button type="button" id="btn-guardar" class="btn btn-secondary">Guardar</button>
                        <button type="button" id="btn-recuperar" class="btn btn-secondary">Recuperar</button>
                        <button type="button" id="btn-esborrar" class="btn btn-danger">Esborrar desat</button>
                        <button type="button" id="btn-resum" class="btn btn-outline">Obrir resum</button>
                    </div> -->
                </form>
            </section>

            <!-- 2. Contenedores de mensajes -->

            <div id="avis" class="avis-container"></div>

                        <span class="metric-label">Durada</span>
